<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="PortfolioStyle.css">
</head>
<body>

  <nav>
    <p>Macalipay, Allen M. - BSIT-2A - 202410098</p>
  </nav>

  <header class="header">
    <h1><strong>PORTFOLIO IN ITEC-55</strong></h1>
    <h4>PLATFORM TECHNOLOGIES</h4>
  </header>

  <main class="category-grid">
    <a href="Seatworks.html" class="category">Seatworks</a>
    <a href="quizzes.html" class="category">Quizzes</a>
    <a href="lab_activities.html" class="category">Lab Activities</a>
    <a href="exam.html" class="category">Exam</a>
  </main>

  <button class="fab" id="openModal">+</button>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add Photo</h2>
      <input type="file" id="photoInput" accept="image/*">
      <select id="categorySelect">
        <option value="">Select Category</option>
        <option value="Seatworks">Seatworks</option>
        <option value="Quizzes">Quizzes</option>
        <option value="Lab Activities">Lab Activities</option>
        <option value="Exam">Exam</option>
      </select>
      <button id="uploadBtn">Upload</button>
      <button id="closeModal">Cancel</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const openModal = document.getElementById('openModal');
    const closeModal = document.getElementById('closeModal');
    const uploadBtn = document.getElementById('uploadBtn');

    openModal.addEventListener('click', () => modal.classList.add('show'));
    closeModal.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

    uploadBtn.addEventListener('click', () => {
      const category = document.getElementById('categorySelect').value;
      const file = document.getElementById('photoInput').files[0];
      if (!category || !file) {
        alert('Please select a category and attach a photo.');
        return;
      }
      alert(`Photo "${file.name}" will be sorted to ${category}.`);
      modal.classList.remove('show');
    });
  </script>
</body>
</html>
