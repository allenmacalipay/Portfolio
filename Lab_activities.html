<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lab Activities Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>

<style>
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Century Gothic", sans-serif;
}

body {
  background: url('Green.jpg') center center / cover no-repeat fixed;
  min-height: 100vh;
}

nav {
  width: 100%;
  background-color: #3e7d36;
  padding: 20px;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  color: white;
  text-align: center;
  font-weight: bold;
}

.content-box {
  width: 90%;
  max-width: 1200px;
  height: 80vh;
  margin: 120px auto 40px;
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 25px rgba(0,0,0,0.25);
  overflow-y: auto;
}

.content-box h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #276929;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
}

.gallery-grid img {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  border-radius: 6px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.gallery-grid img:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 12px rgba(0,0,0,0.25);
}

.fab {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #3e7d36;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  cursor: pointer;
  border: none;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  transition: background 0.3s;
  z-index: 2000;
}
.fab:hover { background: #276929; }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 3000;
}
.modal.show { display: flex; }

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 350px;
  text-align: center;
}

.modal-content h2 {
  margin-bottom: 20px;
  color: #276929;
}

.modal-content input,
.modal-content button {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  font-size: 1rem;
}
.modal-content button {
  background: #3e7d36;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
  transition: background 0.3s;
}
.modal-content button:hover { background: #2f5a28; }

.viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 4000;
}

.viewer.show {
  display: flex;
}

.viewer img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.viewer-close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 40px;
  cursor: pointer;
}

@media (max-width: 600px) {
  .content-box { height: 70vh; }
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}

</style>

<body>
  <nav>
    <p>Macalipay, Allen M. – BSIT-2A – 202410098</p>
  </nav>

  <div class="content-box">
    <h2>Lab Activities</h2>
    <div class="gallery-grid" id="gallery">

    </div>
  </div>


  <button class="fab" id="openModal">+</button>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add Photo</h2>
      <input type="file" id="photoInput" accept="image/*">
      <button id="uploadBtn">Upload</button>
      <button id="closeModal">Cancel</button>
    </div>
  </div>

  <!-- Image Viewer Modal -->
  <div class="viewer" id="viewer">
    <span class="viewer-close" id="viewerClose">&times;</span>
    <img id="viewerImg" src="" alt="Preview">
  </div>

<script>
const modal = document.getElementById('modal');
const openModal = document.getElementById('openModal');
const closeModal = document.getElementById('closeModal');
const uploadBtn = document.getElementById('uploadBtn');
const photoInput = document.getElementById('photoInput');
const gallery = document.getElementById('gallery');

const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerClose = document.getElementById('viewerClose');

openModal.addEventListener('click', () => modal.classList.add('show'));
closeModal.addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

uploadBtn.addEventListener('click', () => {
  const file = photoInput.files[0];
  if (!file) { alert("Please choose an image."); return; }

  const reader = new FileReader();
  reader.onload = e => {
    const img = document.createElement('img');
    img.src = e.target.result;
    img.alt = file.name;
    img.addEventListener('click', () => {
      viewerImg.src = img.src;
      viewer.classList.add('show');
    });
    gallery.appendChild(img);
    modal.classList.remove('show');
    photoInput.value = "";
  };
  reader.readAsDataURL(file);
});

viewerClose.addEventListener('click', () => viewer.classList.remove('show'));
viewer.addEventListener('click', e => { if (e.target === viewer) viewer.classList.remove('show'); });
</script>
</body>
</html>
